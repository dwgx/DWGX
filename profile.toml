# ORIGIN 公共文案：世界协议 / 法则 / 因果记录 / 历史回放。
# 中文正文由渲染器集中取用，不要把这些句子散进多个模板里。
[flagship]
name = "ORIGIN"
kicker = "The Root Source"
title = "World protocol · causal history · replay"
blurb = "Declare a world, let change happen under its laws, and preserve cause and result in replayable history."
url = "https://genesis.wiki"
zh_tagline = "万物有其源。变化有其因。"
zh_intro = [
  "我正在构建一套世界协议与参考运行时。先声明法则、时间和初始条件，再让变化在这些约束里发生，留下原因、依据与结果。",
  "模型可以参与观察和决策，但输出本身不是世界事实。叙事应该解释发生过的事情，而不是反过来改写它。",
]
zh_now = "当前围绕世界声明、执行内核、因果记录和重放核验推进。更完整的生命、生态、社会与文明演化，是继续研究的方向，不是已完成的功能清单。"
zh_far = "我希望历史来自规则、资源、时间与相互作用，而不是预先写好的剧情。重放核验能检查执行一致性，本身不证明世界模型符合现实。"

