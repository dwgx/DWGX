# repo-kit · 每个仓库一份。style 决定视觉母题。
# 数据来源：api.github.com + 各仓库 README 原文（2026-10-01 采集）。
# 只改这个文件；图是生成物，不要手改。
#
# style 速查（motif）：
#   post   BIOS 自检屏 · 点线引导 · 设备/服务清单、仪表盘
#   vt100  终端窗口 · 扫描线 + 块光标 · TUI / PTY
#   seq    协议时序图 · 实线请求 / 虚线响应 · 网关、握手、工作流
#   tree   模块结构树 · 肘形连接 · 分层内核、模块树
#   iso    等距块城市 · 三面着色 · 工具集、应用包
#   scope  示波器 · 荧光曲线 · 持续采样、池化调度
#   card   档案卡 · 纸面 + 骑缝章 · 可查阅的资料、文档库
#   pipe   流水线 · 分段块条 · 多阶段处理、路由
#
# license 取 api.github.com 的 license.spdx_id 原值；"none" = API 里没有 license 对象。
# install 为空的仓库，banner 里就不出现这一行 —— 不拿猜的填。

owner = "dwgx"

