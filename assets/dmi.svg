FFFFF">Phones and mice live in</text><text x="650" y="218" font-size="13" fill="#FFFFFF">hardware.dmp.</text><rect x="0" y="470" width="960" height="30" fill="#000055"/><text x="14" y="490" font-size="12" fill="#FFFF55">F1:Help   Esc:Exit   ↑↓:Select Item   ←→:Select Screen   +/-:Change Values   F9:Setup Defaults   F10:Save &amp; Exit</text></svg>