name: generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snk
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f2a6c4&color_dots=#06020f,#2d1b69,#f2a6c4,#c9a84c,#ffffff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f2a6c4&color_dots=#06020f,#2d1b69,#f2a6c4,#c9a84c,#ffffff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
