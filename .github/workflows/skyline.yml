name: generate skyline png

on:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches:
      - main
    paths:
      - scripts/render_skyline.py
      - .github/workflows/skyline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup gh cli + install gh-skyline extension
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          gh --version
          gh extension install github/gh-skyline

      - name: generate skyline STL from contributions
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          gh skyline --user DWGX --output skyline.stl --year $(date -u +%Y) || \
          gh skyline --user DWGX --output skyline.stl

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install python deps
        run: pip install numpy-stl matplotlib numpy

      - name: render STL -> PNG
        run: python scripts/render_skyline.py skyline.stl assets/skyline.png

      - name: commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline.png
          git diff --cached --quiet && echo "no changes" || \
            (git commit -m "chore: update skyline.png" && git push)
