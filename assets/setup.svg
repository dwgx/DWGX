<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Lucida Console','Courier New',Consolas,monospace"><rect width="960" height="500" fill="#0000AA"/><rect x="0" y="0" width="960" height="26" fill="#000055"/><text x="480" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">AMIBIOS SETUP UTILITY - VERSION 3.31a</text><text x="18" y="45" font-size="14" fill="#55FFFF">Main</text><text x="82" y="45" font-size="14" fill="#55FFFF">Advanced</text><rect x="180" y="30" width="56" height="20" fill="#AAAAAA"/><text x="186" y="45" font-size="14" fill="#000055">Boot</text><text x="250" y="45" font-size="14" fill="#55FFFF">Log</text><text x="304" y="45" font-size="14" fill="#55FFFF">Exit</text><rect x="8" y="54" width="944" height="410" fill="#000055" stroke="#55FFFF" stroke-width="2"/><rect x="12" y="58" width="936" height="402" fill="none" stroke="#55FFFF" stroke-width="1"/><text x="28" y="84" font-size="13" fill="#FFFF55">Boot Settings Configuration</text><text x="28" y="106" font-size="13" fill="#FFFFFF">Quiet Boot                       [Disabled]</text><text x="28" y="126" font-size="13" fill="#FFFFFF">Bootup Num-Lock                  [On]</text><text x="28" y="146" font-size="13" fill="#FFFFFF">Wait For 'F1' If Error           [Enabled]</text><text x="28" y="166" font-size="13" fill="#FFFFFF">Hit 'DEL' Message Display        [Enabled]</text><text x="28" y="186" font-size="13" fill="#FFFF55">Boot Device Priority</text><rect x="20" y="195" width="600" height="18" fill="#AAAAAA"/><text x="28" y="208" font-size="13" fill="#000055">1st Boot Device                  [ORIGIN]</text><text x="28" y="228" font-size="13" fill="#FFFFFF">2nd Boot Device                  [WindsurfAPI v3.9.29]</text><text x="28" y="248" font-size="13" fill="#FFFFFF">3rd Boot Device                  [KiroStudio v1.2.1]</text><text x="28" y="268" font-size="13" fill="#FFFFFF">4th Boot Device                  [vrchat-il2cpp-re]</text><text x="28" y="288" font-size="13" fill="#FFFF55">Hard Disk Drives</text><text x="28" y="310" font-size="13" fill="#FFFFFF">Removable Devices                &gt;</text><text x="28" y="330" font-size="13" fill="#FFFFFF">Network Stack                    [Enabled]</text><rect x="636" y="72" width="308" height="320" fill="#000055" stroke="#55FFFF" stroke-width="1"/><text x="790" y="92" text-anchor="middle" font-size="13" fill="#FFFF55">[ Setup Help ]</text><text x="650" y="116" font-size="13" fill="#FFFFFF">Specifies the first device</text><text x="650" y="133" font-size="13" fill="#FFFFFF">AMIBIOS attempts after POST.</text><text x="650" y="150" font-size="13" fill="#FFFFFF">ORIGIN is the world protocol.</text><text x="650" y="167" font-size="13" fill="#FFFFFF">Public face: genesis.wiki.</text><text x="650" y="184" font-size="13" fill="#FFFFFF">WindsurfAPI is 2nd (2956</text><text x="650" y="201" font-size="13" fill="#FFFFFF">stars, v3.9.29). Use +/- to</text><text x="650" y="218" font-size="13" fill="#FFFFFF">reorder. Enter opens a</text><text x="650" y="235" font-size="13" fill="#FFFFFF">sub-menu. This screen is a</text><text x="650" y="252" font-size="13" fill="#FFFFFF">snapshot, not a live clock.</text><rect x="0" y="470" width="960" height="30" fill="#000055"/><text x="14" y="490" font-size="12" fill="#FFFF55">F1:Help   Esc:Exit   ↑↓:Select Item   ←→:Select Screen   +/-:Change Values   F9:Setup Defaults   F10:Save &amp; Exit</text></svg>