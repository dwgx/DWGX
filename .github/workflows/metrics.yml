name: generate metrics dashboard

on:
  schedule:
    - cron: "0 */8 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # main classic dashboard
  classic:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DWGX
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tokyo
          config_padding: 0, 8px
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics dashboard"

  # isocalendar (等轴测贡献图)
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DWGX
          template: classic
          base: ""
          config_timezone: Asia/Tokyo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          committer_branch: main

  # achievements (取代挂掉的 trophy)
  achievements:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DWGX
          template: classic
          base: ""
          config_timezone: Asia/Tokyo
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0
          output_action: commit
          committer_branch: main

  # habits (编码习惯 — 活跃时间、最常用语言)
  habits:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DWGX
          template: classic
          base: ""
          config_timezone: Asia/Tokyo
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          output_action: commit
          committer_branch: main
