<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Lucida Console','Courier New',Consolas,monospace"><rect width="960" height="500" fill="#000000"/><text x="24" y="28" font-size="14" font-weight="700" fill="#FFFF55">BEEP.ROM</text><text x="24" y="58" font-size="14" fill="#FFFF55">BIOS Beep Codes  —  dwgx.menu</text><text x="24" y="78" font-size="14" fill="#FFFFFF"></text><text x="24" y="98" font-size="14" fill="#FFFFFF">1 short            POST OK, boot ORIGIN</text><text x="24" y="118" font-size="14" fill="#FFFFFF">2 short            WindsurfAPI listening</text><text x="24" y="138" font-size="14" fill="#FFFFFF">1 long 2 short     video / README render fail</text><text x="24" y="158" font-size="14" fill="#FFFFFF">1 long 3 short     no Glama / PR closed by deleting fork</text><text x="24" y="178" font-size="14" fill="#FFFFFF">continuous         labeled-issue noise on the cover (fixed)</text><text x="24" y="198" font-size="14" fill="#FFFFFF">no beep            Homecloud tunnel 1033</text><text x="24" y="218" font-size="14" fill="#FFFFFF"></text><text x="24" y="238" font-size="14" fill="#55FFFF">If you hear 1 long 3 short: re-open the PR. Do not delete the fork.</text><rect x="0" y="472" width="960" height="28" fill="#111111"/><text x="24" y="490" font-size="12" fill="#AAAAAA">speaker: PC beep  ·  not a clock</text></svg>