<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300"><rect width="920" height="300" rx="2" fill="#E9DECA" stroke="#CEB27C" stroke-width="1"/><text x="44" y="52" font-family="ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="14" font-weight="700" fill="#735A31" letter-spacing="2">ORIGIN · The Root Source</text><text x="876" y="52" font-family="ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="11" fill="#735A31" text-anchor="end" letter-spacing="1">WORK IN PROGRESS</text><line x1="44" y1="72" x2="876" y2="72" stroke="#CEB27C" stroke-width="1"/><text x="44" y="132" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="34" fill="#282A2F">万物有其源。变化有其因。</text><line x1="44" y1="164" x2="876" y2="164" stroke="#CEB27C" stroke-width="1"/><text x="44" y="200" font-family="ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12" fill="#735A31">01</text><text x="74" y="200" font-family="ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="15" font-weight="700" fill="#282A2F" letter-spacing="2">DECLARE</text><text x="44" y="228" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="13" fill="#282A2F">定义世界可以发生什么</text><text x="254" y="200" font-family="ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12" fill="#735A31">02</text><text x="284" y="200" font-family="ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="15" font-weight="700" fill="#282A2F" letter-spacing="2">RESOLVE</text><text x="254" y="228" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="13" fill="#282A2F">在约束内处理变化</text><text x="464" y="200" font-family="ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="12" fill="#735A31">03</text><text x="494" y="200" font-family="ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="15" font