# repo-kit · 跨仓库页头/背景图生成器的事实来源
# 每个仓库一份；build.py <name> 生成 docs/assets/banner.svg 并打印 README 注入块。
# 只改这个文件，不手改生成出来的图。

owner = "dwgx"

[[repo]]
name = "WindsurfAPI"
tagline = "Windsurf / Devin 100+ 模型 · 多协议 · zero-dep 自托管"
install = "git clone https://github.com/dwgx/WindsurfAPI && cd WindsurfAPI && node server.js"
lang = "JavaScript"
license = "MIT"
accent = "sakura"
topics = ["ai", "api-gateway", "anthropic", "openai", "gemini", "self-hosted"]
links = [
  { label = "docs", url = "https://github.com/dwgx/WindsurfAPI#readme" },
  { label = "releases", url = "https://github.com/dwgx/WindsurfAPI/releases" },
  { label = "issues", url = "https://github.com/dwgx/WindsurfAPI/issues" },
]

