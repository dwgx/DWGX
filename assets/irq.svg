<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Lucida Console','Courier New',Consolas,monospace"><rect width="960" height="500" fill="#0000AA"/><rect x="0" y="0" width="960" height="26" fill="#000055"/><text x="480" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">AMIBIOS SETUP UTILITY - VERSION 3.31a</text><text x="18" y="45" font-size="14" fill="#55FFFF">PnP</text><text x="72" y="45" font-size="14" fill="#55FFFF">PCI</text><rect x="120" y="30" width="46" height="20" fill="#AAAAAA"/><text x="126" y="45" font-size="14" fill="#000055">IRQ</text><text x="180" y="45" font-size="14" fill="#55FFFF">Chipset</text><text x="274" y="45" font-size="14" fill="#55FFFF">Health</text><rect x="8" y="54" width="944" height="410" fill="#000055" stroke="#55FFFF" stroke-width="2"/><rect x="12" y="58" width="936" height="402" fill="none" stroke="#55FFFF" stroke-width="1"/><text x="28" y="82" font-size="13" fill="#FFFF55">Interrupt Request Table</text><text x="28" y="106" font-size="12" fill="#55FFFF">LINE     DEVICE              NOTE                         CLASS</text><text x="28" y="130" font-size="13" fill="#FFFFFF">IRQ 0    timer              rtc.ok                     system</text><text x="28" y="150" font-size="13" fill="#FFFFFF">IRQ 1    keyboard           VGN FLASH Ultra            usb</text><text x="28" y="170" font-size="13" fill="#FFFFFF">IRQ 3    COM2               cursorapi                  pool</text><text x="28" y="190" font-size="13" fill="#FFFFFF">IRQ 4    COM1               event log                  live</text><rect x="20" y="197" width="600" height="18" fill="#AAAAAA"/><text x="28" y="210" font-size="13" fill="#000055">IRQ 5    WindsurfAPI        2950 ★  6 open             nic</text><text x="28" y="230" font-size="13" fill="#FFFFFF">IRQ 7    KiroStudio         13 ★                       scsi</text><text x="28" y="250" font-size="13" fill="#FFFFFF">IRQ 9    ORIGIN             genesis.wiki               acpi</text><text x="28" y="270" font-size="13" fill="#FFFFFF">IRQ 10   vrchat-il2cpp-re   24 ★                       game</text><text x="28" y="290" font-size="13" fill="#FFFFFF">IRQ 11   SmartCLI           PTY + pyte                 tty</text><text x="28" y="310" font-size="13" fill="#FFFFFF">IRQ 12   mouse              Dragonfly 3 / King         usb</text><text x="28" y="330" font-size="13" fill="#FFFFFF">IRQ 14   YuKiKo             19 ★                       ide</text><text x="28" y="350" font-size="13" fill="#FFFFFF">IRQ 15   VRCSM              3 ★                        ide</text><rect x="636" y="72" width="308" height="360" fill="#000055" stroke="#55FFFF" stroke-width="1"/><text x="790" y="92" text-anchor="middle" font-size="13" fill="#FFFF55">[ Setup Help ]</text><text x="650" y="116" font-size="13" fill="#FFFFFF">IRQ 5 is the public flagship.</text><text x="650" y="133" font-size="13" fill="#FFFFFF">Open-issue counts ride the IRQ</text><text x="650" y="150" font-size="13" fill="#FFFFFF">as load. COM1 is the event</text><text x="650" y="167" font-size="13" fill="#FFFFFF">log. Keyboard and mice are</text><text x="650" y="184" font-size="13" fill="#FFFFFF">real USB, not metaphors only.</text><rect x="0" y="470" width="960" height="30" fill="#000055"/><text x="14" y="490" font-size="12" fill="#FFFF55">F1:Help   Esc:Exit   ↑↓:Select Item   ←→:Select Screen   +/-:Change Values   F9:Setup Defaults   F10:Save &amp; Exit</text></svg>