name: render profile

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile.toml"
      - "scripts/**"
      - ".github/workflows/profile.yml"
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write
  issues: read

concurrency:
  group: dwgx-main-writers
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name != 'issue_comment' || github.event.issue.title == 'Event Log'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render README + process.table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --quiet pillow
          python scripts/render_profile.py

      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg assets/discord-avatar.png assets/discord-presence.json scripts/ami.py scripts/ami_book.py
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh profile numbers"
          git pull --rebase origin main
          git push
