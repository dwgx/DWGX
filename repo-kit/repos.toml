# repo-kit · 每个仓库一份。style 决定视觉母题，accent 不再决定外观。
# 只改这个文件；图是生成物，不要手改。
#
# style 速查（motif）：
#   post   BIOS 自检屏 · 点线引导 · 适合设备/服务清单类
#   vt100  终端窗口 · 扫描线 + 块光标 · 适合 TUI/PTY 类
#   seq    协议时序图 · 实线请求/虚线响应 · 适合网关/协议桥
#   tree   模块结构树 · 肘形连接 · 适合内核/分层类
#   iso    等距块城市 · 三面着色 · 适合工具集/插件集
#   scope  示波器 · 荧光曲线 · 适合持续采样的研究/网关
#   card   档案卡 · 纸面 + 骑缝章 · 适合可查阅的资料/笔记
#   pipe   流水线 · 分段块条 · 适合多阶段处理/调度

owner = "dwgx"

[[repo]]
name = "WindsurfAPI"
style = "pipe"
tagline = "Windsurf / Devin 100+ 模型 · 多协议 · zero-dep 自托管"
install = "git clone https://github.com/dwgx/WindsurfAPI && cd WindsurfAPI && node server.js"
lang = "JavaScript"
license = "MIT"
stages = ["ingest", "auth", "route", "adapt", "serve"]
topics = ["ai", "api-gateway", "anthropic", "openai", "gemini", "self-hosted"]
links = [
  { label = "docs", url = "https://github.com/dwgx/WindsurfAPI#readme" },
  { label = "releases", url = "https://github.com/dwgx/WindsurfAPI/releases" },
  { label = "issues", url = "https://github.com/dwgx/WindsurfAPI/issues" },
]

