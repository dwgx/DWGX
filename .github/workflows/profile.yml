name: render profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile.toml"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: dwgx-main-writers
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render README + process.table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --quiet pillow
          python scripts/render_profile.py

      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/process-table.svg assets/stats.svg assets/langs.svg assets/discord.svg assets/discord-avatar.png assets/media.svg assets/setup.svg assets/doing.svg assets/today.svg assets/git.svg assets/inbox.svg assets/dmesg.svg
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh profile numbers"
          git pull --rebase origin main
          git push
